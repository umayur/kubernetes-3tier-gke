apiVersion: v1
kind: Pod
metadata:
  name: postgres
  namespace: cloudops
  labels:
    app: postgres

spec:
  containers:
    - name: postgres
      image: postgres:16

      ports:
        - containerPort: 5432

      env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: backend-secret
              key: DB_USERNAME

        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: backend-secret
              key: DB_PASSWORD

        - name: POSTGRES_DB
          value: cloudops_expenses

      volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
          subPath: postgres

  volumes:
    - name: postgres-storage
      persistentVolumeClaim:
        claimName: postgres-pvc